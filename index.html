    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Fonts.
         This used to be a preload carrying onload="this.rel='stylesheet'" to
         promote itself once it arrived. That is an inline event handler, and
         the site's Content-Security-Policy forbids inline script — so the
         handler never ran, the promotion never happened, and the file was
         fetched and then ignored. (CSP cannot whitelist an event handler by
         hash; only 'unsafe-hashes' allows those, which is not worth it for
         one line.)

         A plain stylesheet link instead: preconnect above has the connection
         already open, the file is about a kilobyte, and display=swap paints
         text in the fallback face immediately rather than waiting. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;700;900&display=swap"
    />

    <!-- Structured data: tells Google who this site is about (rich results). -->
    <!-- Structured data, as one @graph so the nodes can reference each other
         by @id instead of repeating the same details three times.

         Person alone was never enough. Google's local and service results are
         keyed off an organisation with a place and a service catalogue, not
         off a person with a job title, so ProfessionalService is what makes
         "graphic designer Beirut" a query this site can answer.

         WHAT IS DELIBERATELY ABSENT: aggregateRating and review. There are no
         published testimonials on this site (TESTIMONIALS in siteData.js is
         intentionally empty), and marking up ratings that do not exist is
         fabrication — it is also the single most common trigger for a
         structured-data manual action. Add them here only when real, named,
         verifiable reviews exist on the page itself.

         KEEP PRICES IN STEP with siteData.js. A price here that disagrees
         with the page is worse than no price at all: Google reads this one
         and shows it, and the visitor reads the other one. -->
