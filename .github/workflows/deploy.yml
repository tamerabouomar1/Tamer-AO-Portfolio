name: Deploy to GitHub Pages

# Cloudflare Workers cannot serve a domain whose nameservers it does not
# manage, which rules out every free subdomain (is-a.dev, eu.org). GitHub
# Pages accepts an external CNAME, so it is what makes a free custom domain
# possible at all. The Cloudflare Worker is deliberately left running as a
# fallback — nothing here removes it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build

      # GitHub Pages has no SPA rewrite. Serving index.html as the 404 page
      # is the supported workaround: any unmatched path still boots the app,
      # so /websites and /templates/onyx survive a direct load or refresh
      # instead of showing GitHub's 404.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
