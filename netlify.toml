# Netlify deploy config for the Vite + React app
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so client-side routes (/projects, /media, /about, /fitness)
# work on direct load / refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Images/videos: cache for 30 days so repeat visits and page switches are
# instant, but still refresh within a month if a file is replaced in place.
# (To force an immediate update, bump a query string, e.g. avatar.jpg?v=2.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Vite fingerprints its bundles (index-<hash>.js/css), so a new build always
# has a new name — safe to cache forever.
[[headers]]
  for = "/assets/index-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The client-site snapshots under /demo are copies of sites that live on their
# own domains, so they must not be indexed here — a second copy of a client's
# site competes with the real one for the client's own name. Mirrors the
# /demo/* rule in public/_headers, which is what Cloudflare actually serves.
[[headers]]
  for = "/demo/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
